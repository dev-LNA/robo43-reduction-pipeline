[instrument]
name = "t80s"
matches = { TELESCOP = ["T80"], INSTRUME = ["T80Cam"] }
# The raw header WCS (CD matrix = 0.500"/pix) and HIERARCH T80S INS PIXSCALE
# = '0.500' are nominal, as are CCDPXSZX = 9.0 um and HIERARCH T80S TEL FOCU
# LEN = 1000 mm. The e2v CCD290-99 has 10 um pixels and the published T80S
# plate scale is ~0.55"/pix (1.4 x 1.4 deg field). Needs confirmation from a
# plate solve; trust_header_wcs = false below overrides derive_pixel_scale's
# normal preference for the header WCS.
pixel_scale_arcsec = 0.55
# The raw CD matrix is nominal, not a plate solve: this also makes reduced
# output products carry a WCS rescaled to pixel_scale_arcsec instead of the
# raw header's nominal one (see robo43.products.nominal_wcs).
trust_header_wcs = false
# gain_e_per_adu is deliberately absent: PG5_2 ("Gain, (High)") is a readout
# gain *mode flag*, not e-/ADU. The conversion must be measured at runtime by
# src/robo43/calib/gain.py from photon-transfer pairs of flats and biases.
# The CCD has 16 amplifiers, each with its own gain; until per-amplifier gain
# measurement exists only a single whole-frame value can be measured.
# 16-bit ADC ceiling (BZERO = 32768 unsigned). Provisional: replace with the
# measured saturation / non-linearity onset once flats are available.
saturation_adu = 65535
# Provisional: stars peaking at 45k-59k e- showed ~2.7x their expected
# scatter, and a linearity measurement is still needed to pin down the true
# non-linearity onset.
nonlinearity_adu = 45000
binning_keyword = "PG5_4"

# Overscan is not hardcoded: each of the 16 amplifier segments has whole-line
# prescan/overscan strips (bias ~1000 ADU) at the segment edges and at the
# chip's horizontal midline, detected at runtime by src/robo43/calib/overscan.py.
[instrument.layout]
# fpacked files (.fits.fz): HDU 0 is an empty primary, the image is HDU 1.
science_hdu = 1
n_amplifiers = 16
flip_y = false

[instrument.filters]
# S-PLUS / Javalambre 12-band system. Only "R" has been seen in real headers
# so far; the other spellings are assumed and must be checked against data.
# T80S "R" is the S-PLUS rSDSS filter (~/Dropbox/splus_filters/rSDSS.csv:
# pivot 6252 A, half-power 5530-6990 A), NOT Bessell/Cousins R. G, I, Z and U
# are likewise gSDSS, iSDSS, zSDSS and uJAVA.
valid = ["U", "F378", "F395", "F410", "F430", "G", "F515", "R", "F660", "I", "F861", "Z"]

[instrument.filters.map]
# S-PLUS band names -> the names T80S writes in FILTER.
rSDSS = "R"
gSDSS = "G"
iSDSS = "I"
zSDSS = "Z"
uJAVA = "U"

[instrument.keywords]
gain_setting = ["PG5_2"]
binning = ["PG5_4"]
ccd_temp = ["CCD-TEMP"]

[instrument.readout_mode_rule]
# T80S has two camera readout modes that must never share calibrations:
# "mode0" (gain ~2.06 e-/ADU, read noise ~7.1 e-; nights 20250531-20250629)
# and "mode5" (the standard: gain ~0.93 e-/ADU, read noise ~4.35 e-; nights
# 20251027 onward). The headers have no readout-mode keyword; these cards
# separate the modes with no exception in 2991 frames of 65 nights. Votes are
# listed in priority order and the first one present decides. If the votes
# present disagree a WARNING is logged (once per process, then DEBUG); with no
# vote at all `default` is used, with a WARNING logged the same way. The
# result is FrameMeta.readout_mode (origin "derived"), set in
# robo43.io.headers.read_meta so every consumer (calibration pooling, gain
# grouping, reduction, inventory) sees it; it replaces a readout_mode read from
# the header aliases but never a --set / overrides value. gain_setting stays
# the raw PG5_2 value (0 = "Gain, (Normal)", 1 = "Gain, (High)"; 0 is a valid
# value, not a header failure).
default = "mode5"

[[instrument.readout_mode_rule.votes]]
# PG0_50 "Gain S, Volts": a live readback, -13.00..-12.87 in mode0 and
# 0.024..0.121 in mode5.
keyword = "PG0_50"
threshold = -6.0
below = "mode0"
at_or_above = "mode5"

[[instrument.readout_mode_rule.votes]]
# PG5_1 "DSI Sample Time, 10 ns": 17 in mode0, 68 in mode5; any other value
# casts no vote.
keyword = "PG5_1"
map = { "17" = "mode0", "68" = "mode5" }

[[instrument.readout_mode_rule.votes]]
# PG5_2 "Gain, (Normal)" / "Gain, (High)": 0 in mode0, 1 in mode5; any other
# value casts no vote.
keyword = "PG5_2"
map = { "0" = "mode0", "1" = "mode5" }

[instrument.tile_gain_pattern]
# Relative gain of each of the 16 amplifier tiles for each readout mode, one value per tile in
# row-major tile order (tile = row_block * 8 + col_block; 8 x 2 tiles of 1152 x 4616 px in the
# trimmed 9216 x 9232 frame, the order of OverscanGeometry.science_tile_slices). Normalised to
# median 1, like the summary gain K (the median over tiles): the gain of tile t is
# K_run * p_t, where K_run is the run's measured summary gain (robo43.calib.gain). The noisy
# per-tile photon-transfer values (0.5-1.1 % rms error per measurement, from the bias-limited
# variance of one to three flat pairs per tile) are then not used for the flat or science
# conversion; they stay in gain_measurements.json as ptc_gain_e_per_adu. The true tile gain
# pattern is a stable property of the readout mode (0.01-0.04 % over three months) and differs
# between the modes by 0.46 % rms (max 0.93 %). A mode with no entry keeps its per-tile PTC gains.
# Products built with a table carry GAINPAT = 'table:<mode>'; a master flat is reused for another
# night only if it carries the same GAINPAT (robo43.calib.pool.find_nearest_master_flat).
#
# Derived 2026-10-06 (robo43 commit 74d8339 + this change) from the amplifier-boundary
# continuity of master flats: `robo43 tilegain derive --instrument t80s --mode MODE --grid 8x2
# MASTER...` (robo43.calib.tilegain: 16-px strips with a 64-px margin, gradient-corrected steps,
# log-multiplicative least squares over the 22 boundaries, mean of ln p over the masters). Every
# master was converted to ADU with the per-tile gains in its own header (GAIN00..GAIN15).
# Fit residual 0.023-0.044 % rms per mode5 master (0.029 / 0.034 % mode0), the same as the null
# (pseudo-boundary, 32 per master) rms of 0.021-0.042 % (0.024 / 0.031 %): the steps are pure
# per-tile factors.
#
# mode5: 7 masters master_flat_R_dome.fits built from raw R sky flats of single nights
# 20251027 (8 flats), 20251111 (6), 20251121 (5), 20251202 (10), 20251217 (7), 20251224 (8),
# 20260104 (8) with the 22 biases of 20251209 + 20251210 (raw night directories), flat_min_level_frac
# 0.15. Scatter between the masters (std of 100 ln p): rms 0.028 %, max 0.038 % per tile.
# (The 16 production masters 20251104-20251218 all use the same 13 flats, so they are not
# independent: they agree with each other to 0.002 % and with this table to 0.016 % rms.)
# mode0: 2 masters master_flat_G_dome.fits built from the G sky flats of 20250605 (4 flats, no
# measurable gain, ADU master) and 20250620 (6 of 7 accepted) with the 22 biases of 20250608 +
# 20250609. Scatter between the two: rms 0.013 %, max 0.035 % per tile. The production master
# 20250610/calib/master_flat_G_dome.fits (both nights) agrees with this table to 0.017 % rms.
# mode5 / mode0 reproduces the cross-mode correction of tests/reports/t80s_flat_crossmode_REPORT.md
# (relphot repository) to 0.03 % rms.
mode0 = [
    1.000789, 1.000631, 0.991503, 0.983752, 0.986264, 0.981943, 0.962495, 0.973566,
    1.024559, 1.015082, 0.999369, 1.010051, 1.004900, 1.009956, 1.003919, 0.990410,
]
mode5 = [
    0.998777, 1.000320, 1.003677, 0.985880, 0.987270, 0.985879, 0.961582, 0.971447,
    1.024238, 1.016980, 0.999680, 1.013516, 1.014673, 1.016286, 1.016400, 0.993853,
]

[instrument.imagetyp_map]
# T80S writes IMAGETYP = 'sky-flat' for twilight flats (bias frames are
# already 'ZERO' and science 'OBJECT', which the default map handles).
"sky-flat" = "flat"
"skyflat" = "flat"

[instrument.site]
lat_deg = -30.1678638889
lon_deg = -70.8056888889
elevation_m = 2187

[instrument.astrometry]
index_scales = "derive"
search_radius_deg = 0.5

[instrument.calib]
# Calibration frames are pooled from the sibling night directories on BOTH
# sides of the night being reduced (see robo43.calib.pool); only frames with
# the science frames' readout mode / gain setting / binning (and, for flats,
# the same filter) count, whole nights are added nearest first (earlier night
# first on a tie), and a pool short of its target is used as-is with a WARNING.
#
# Master bias: the night's own bias plus every night within +/-10 days, until
# at least 20 frames. Applies always, not only when the night has no bias.
# Fewer than 20 frames in the window: WARNING and build from what is there.
# bias_pool_gain_max_frames limits how many of them the runtime gain
# measurement reads (it holds one full-frame array per bias frame in RAM).
bias_pool = true
bias_pool_window_nights = 10
bias_pool_target_frames = 20
bias_pool_gain_max_frames = 12
# Master flat, per filter: every night within +/-30 days (60 days in all),
# until at least 20 frames (the cold-pixel mask needs >= 20). Twilight flats
# drift slowly (dust, mirror coatings). flat_pool_window_nights > 0 replaces
# the older backward-only 10/20-night pool (flat_pool_min_nights /
# flat_pool_max_nights, now unused here).
# A filter whose window holds fewer than flat_pool_target_frames flats is NOT
# built from the short pool: the existing master flat of that filter closest
# in time to the night (either direction, no maximum distance, earlier night
# on a tie; built from >= 20 frames when its header says so) is copied from
# <root>/YYYYMMDD/calib/ of the listed reduced trees. Only if no such master
# exists is the short pool built, with a WARNING. (Bias is separate: with no
# bias at all in its window the search goes on to earlier nights, calib.
# fallback_max_nights_bias.)
flat_pool = true
flat_pool_window_nights = 30
flat_pool_target_frames = 20
flat_master_roots = ["/mnt/sto01/T80S/reduced"]

[instrument.filters.gaia_xp]
# GaiaXPy PhotometricSystem.JPLUS band names (confirmed against the
# installed gaiaxpy 2.1.4 via PhotometricSystem.JPLUS.get_bands(), not
# guessed): S-PLUS and J-PLUS are twin surveys sharing the same 12-band
# Javalambre filter set (T80S/T80N are the twin telescopes), so gaiaxpy's
# JPLUS synthetic-photometry system applies directly to T80S. Used only
# when the optional gaiaxpy dependency (pyproject.toml [project.optional-
# dependencies] "gaia" extra) is installed; see robo43.photometry.gaia_zp.
U = "uJAVA"
F378 = "J0378"
F395 = "J0395"
F410 = "J0410"
F430 = "J0430"
G = "gJPLUS"
F515 = "J0515"
# rJPLUS == S-PLUS rSDSS: rSDSS.csv convolved with 60 Gaia XP spectra of T80S
# stars agrees with gaiaxpy rJPLUS to 0.001 mag (rms 0.001), 2026-09-30.
R = "rJPLUS"
F660 = "J0660"
I = "iJPLUS"
F861 = "J0861"
Z = "zJPLUS"

[instrument.filters.gaia_transform]
# Fallback when gaiaxpy is unavailable or the XP query fails: a Gaia DR3
# G-band colour transform to an SDSS quantity (Riello et al.
# 2021, A&A 649, A3, "Gaia Early Data Release 3: Photometric content and
# validation", arXiv:2012.01916v1, Appendix C, Table C.2; see
# robo43.photometry.gaia_zp.GAIA_TRANSFORMS for the exact coefficients).
# Only the three T80S broad bands with both an official Riello+2021
# relation and a plausible SDSS-like bandpass are mapped here; the nine
# narrow Javalambre filters and uJAVA have no Gaia broad-band analogue and
# are deliberately left unmapped -- absolute calibration for them is only
# ever available via [instrument.filters.gaia_xp] above.
# For T80S R (S-PLUS rSDSS) the Riello sdss_r relation is off by 0.02-0.06 mag
# (slope +0.06 mag/mag in BP-RP vs rJPLUS); fallback only.
G = "sdss_g"
R = "sdss_r"
I = "sdss_i"
